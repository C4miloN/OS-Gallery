<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orange Survival</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="gallery-header">
    <h1>Orange Survival</h1>
    <p class="subtitle">C4miloN</p>

  <main class="gallery-container" id="gallery">
  </main>

  <div class="lightbox" id="lightbox">

    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">&#10095;</button>
    <img class="lightbox-image" id="lightbox-image" src="" alt="Imagen ampliada">
    <span class="lightbox-counter" id="lightbox-counter"></span>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
